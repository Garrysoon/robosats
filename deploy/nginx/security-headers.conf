# ==============================================================================
# RoboSats Hardened Security Headers
# Compatible with Tor Browser, Chromium, Firefox and RoboSats Native Clients
# ==============================================================================

# Content Security Policy (CSP):
# - default-src 'self': Restrict resource loading to self origin
# - script-src: Allow self and inline scripts required for Unfold/SPA hydration
# - style-src: Allow self and stylesheets (Google Fonts / Material Symbols)
# - font-src: Allow local and Google Fonts / Material Symbols
# - img-src: Allow self, inline data URIs and blob URIs for robot avatars and QR codes
# - connect-src: Allow self, HTTP/S APIs and WebSocket (ws:/wss:) endpoints
# - object-src 'none': Completely disable Flash, Java, and legacy plugins
# - frame-ancestors 'none': Prevent clickjacking / iframe embedding
# - base-uri 'self': Prevent malicious <base> tag hijacking
# - form-action 'self': Ensure forms submit only to self origin
# - permissions-policy: Disable camera, mic, geolocation hardware access
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self'" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options nosniff always;

# Prevent clickjacking in legacy browsers
add_header X-Frame-Options DENY always;

# Do not leak referrers to external sites
add_header Referrer-Policy no-referrer always;

# Hardware and browser feature restrictions
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
