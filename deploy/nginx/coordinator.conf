# ==============================================================================
# RoboSats Production Coordinator Hardened Nginx Reverse Proxy Configuration
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=coord_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=coord_auth:10m rate=5r/s;

upstream robosats_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream strfry_nostr_relay {
    server 127.0.0.1:7778;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Include centralized hardened headers
    include /etc/nginx/security-headers.conf;

    client_max_body_size 10M;
    large_client_header_buffers 4 64k;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # Static assets with long-term immutable caching
    location /static/ {
        alias /var/www/robosats/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Health check endpoint for failover watchdog and uptime monitoring
    location ~ ^/(api/v1/health|coordinator/health)/?$ {
        access_log off;
        proxy_pass http://robosats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # Nostr WebSocket Relay Proxy (Strfry)
    location /relay {
        proxy_pass http://strfry_nostr_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Django Channels WebSocket connections (/ws/)
    location /ws/ {
        proxy_pass http://robosats_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Rate-limited API routes
    location /api/ {
        limit_req zone=coord_api burst=50 nodelay;
        proxy_pass http://robosats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # Coordinator Cockpit & Django Admin (/coordinator/)
    location /coordinator/ {
        limit_req zone=coord_auth burst=20 nodelay;
        proxy_pass http://robosats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # Root fallback
    location / {
        proxy_pass http://robosats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
