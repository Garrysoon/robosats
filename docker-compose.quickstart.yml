version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: robosats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robosats-coordinator
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      - DEVELOPMENT=True
      - LANGUAGE_CODE=ru
      - ESCROW_USERNAME=${ESCROW_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - REDIS_URL=redis://redis:6379/1
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - .:/usr/src/robosats
      - coordinator_data:/usr/src/robosats/data
    entrypoint: ["bash", "/usr/src/robosats/docker/entrypoint-coordinator.sh"]

volumes:
  redis_data:
  coordinator_data:
